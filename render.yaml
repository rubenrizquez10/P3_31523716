services:
  - type: web
    name: api-security-project
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /tmp/database.sqlite
    healthCheckPath: /health
